<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self'; style-src 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<title>Julian Jorge Berthiaume · Inaka Excursions</title>
<meta name="description" content="Julian Jorge Berthiaume — Founder / Guide, Inaka Excursions. Tap to save my contact.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Jost:wght@400;500&family=Shippori+Mincho:wght@600&display=swap">
<style>
:root{--washi:#EAE5DF;--washi-2:#F4F1EC;--ink:#2B2A28;--ink-2:#6A6862;--line:#D6D0C6;--matcha:#637545;--matcha-dk:#4E5D36;--matcha-pale:#E3E7D6;--seal:#AA5444;color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--washi);color:var(--ink);font-family:"Jost","Hiragino Sans","Noto Sans JP",Arial,sans-serif;line-height:1.5;-webkit-tap-highlight-color:transparent}
.app{max-width:440px;margin:0 auto;padding:max(20px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(24px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));display:flex;flex-direction:column;gap:16px}
.brand{display:flex;align-items:center;gap:10px}
.seal{width:26px;height:26px;background:var(--seal);color:#F4EBE3;font:600 15px/26px "Shippori Mincho",serif;text-align:center}
.brand b{font:500 12px/1 "Cormorant Garamond",serif;letter-spacing:.38em;color:var(--ink-2)}
.cards{display:flex;gap:12px;justify-content:center}
.cards img{width:calc(50% - 6px);max-width:180px;height:auto;aspect-ratio:55/91;box-shadow:0 1px 2px rgba(43,42,40,.12),0 8px 20px rgba(43,42,40,.14)}
h1{margin:0;font:600 30px/1.15 "Cormorant Garamond",serif;text-align:center}
.role{margin:-10px 0 0;text-align:center;color:var(--ink-2);letter-spacing:.12em;font-size:14px}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;min-height:54px;border-radius:12px;font-weight:500;font-size:16px;text-decoration:none;transition:background .15s}
.btn svg{width:20px;height:20px;flex:none}
.primary{background:var(--matcha);color:#fff}
.primary:hover,.primary:active{background:var(--matcha-dk)}
.primary small{display:block;font-size:12px;font-weight:400;opacity:.85}
.links{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.outline{border:1.5px solid var(--matcha);color:var(--matcha);background:transparent;min-height:48px;font-size:15px}
.outline:hover,.outline:active{background:var(--matcha-pale)}
.info{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:6px;font-size:15px}
.info span{color:var(--ink-2);font-size:12px;display:block}
.info p{margin:0;word-break:break-all;user-select:all}
.hint{font-size:12.5px;color:var(--ink-2);text-align:center;margin:0}
a:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
</style>
</head>
<body>
<main class="app">
  <div class="brand"><span class="seal" aria-hidden="true">秘</span><b>INAKA EXCURSIONS</b></div>
  <div class="cards">
    <img src="front.jpg" alt="Business card, front: Julian Jorge Berthiaume, Founder / Guide" width="480" height="794">
    <img src="back.jpg" alt="Business card, back: 秘境 Inaka Excursions" width="480" height="794">
  </div>
  <h1>Julian Jorge Berthiaume</h1>
  <p class="role">Founder / Guide · Inaka Excursions</p>

  <a class="btn primary" href="julian-berthiaume.vcf" download="Julian-Berthiaume.vcf">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="4"/><path d="M2 21a7 7 0 0 1 14 0"/><path d="M19 8v6M16 11h6"/></svg>
    <span>連絡先に追加<small>Save to contacts</small></span>
  </a>

  <div class="links">
    <a class="btn outline" href="https://inaka-tours.com" rel="noopener">Website</a>
    <a class="btn outline" href="https://www.instagram.com/inakaexcursions" rel="noopener">Instagram</a>
    <a class="btn outline" href="https://www.tiktok.com/@inakaexcursions" rel="noopener">TikTok</a>
    <a class="btn outline" href="mailto:julian105jj@gmail.com">Email</a>
  </div>

  <div class="info">
    <div><span>Phone</span><p>+81 80-4340-9837</p></div>
    <div><span>Email</span><p>julian105jj@gmail.com</p></div>
  </div>
  <p class="hint">「連絡先に追加」を押すと、スマホの連絡先に登録できます。<br>Tap “Save to contacts” to add me on your phone.</p>
</main>
</body>
</html>
